<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受注・出荷指示ツール</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- body の data-auth で表示を切り替える：checking（確認中）／signed-out（未ログイン）／denied（このアカウントでは使えない）／ok（使える） -->
<body data-auth="checking">
  <header class="app-header no-print">
    <h1 class="app-title">受注・出荷指示ツール</h1>
    <nav class="menu only-ok">
      <a href="#order" data-view="order">注文の登録</a>
      <a href="#ledger" data-view="ledger">台帳</a>
      <a href="#sheet" data-view="sheet">出荷指示書</a>
    </nav>
  </header>

  <main>
    <section class="auth-box only-checking">
      <p>確認中…</p>
    </section>

    <section class="auth-box only-signed-out">
      <h2>ログイン</h2>
      <p>このツールは運営者（私）だけが使えます。Google アカウントでログインしてください。</p>
      <button type="button" id="login-button" class="primary">Google でログイン</button>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section class="auth-box only-denied">
      <h2>このアカウントでは使えません</h2>
      <p>ログインしたアカウント：<span class="account-email"></span></p>
      <p>台帳を読む権限がありません。運営者のアカウントでログインし直してください。</p>
      <p class="uid-line">UID：<code class="account-uid"></code></p>
      <button type="button" class="logout-button">ログアウト</button>
    </section>

    <div class="only-ok">
      <section id="view-order" class="view">
        <h2>注文の登録</h2>
        <p class="placeholder">ここに注文の入力画面をつくります（WBS 1-1）。</p>
      </section>

      <section id="view-ledger" class="view">
        <h2>台帳</h2>
        <p class="placeholder">ここに登録した注文の一覧をつくります（WBS 1-4）。</p>
      </section>

      <section id="view-sheet" class="view">
        <h2>出荷指示書</h2>
        <p class="placeholder">ここにその日の出荷指示書をつくります（WBS 2-1〜2-3）。</p>
      </section>
    </div>
  </main>

  <footer class="app-footer no-print">
    <div id="firebase-status">Firebase：確認中…</div>
    <div class="only-ok">
      ログイン中：<span class="account-email"></span>
      <button type="button" class="logout-button link-button">ログアウト</button>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
