<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受注・出荷指示ツール</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- body の data-auth で表示を切り替える：checking（確認中）／signed-out（未ログイン）／denied（このアカウントでは使えない）／ok（使える） -->
<body data-auth="checking">
  <header class="app-header no-print">
    <h1 class="app-title">受注・出荷指示ツール</h1>
    <nav class="menu only-ok">
      <a href="#order" data-view="order">注文の登録</a>
      <a href="#ledger" data-view="ledger">台帳</a>
      <a href="#sheet" data-view="sheet">出荷指示書</a>
    </nav>
  </header>

  <main>
    <section class="auth-box only-checking">
      <p>確認中…</p>
    </section>

    <section class="auth-box only-signed-out">
      <h2>ログイン</h2>
      <p>このツールは運営者（私）だけが使えます。Google アカウントでログインしてください。</p>
      <button type="button" id="login-button" class="primary">Google でログイン</button>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section class="auth-box only-denied">
      <h2>このアカウントでは使えません</h2>
      <p>ログインしたアカウント：<span class="account-email"></span></p>
      <p>台帳を読む権限がありません。運営者のアカウントでログインし直してください。</p>
      <p class="uid-line">UID：<code class="account-uid"></code></p>
      <button type="button" class="logout-button">ログアウト</button>
    </section>

    <div class="only-ok">
      <section id="view-order" class="view">
        <h2>注文の登録</h2>
        <form id="order-form" class="order-form" novalidate>
          <div class="field">
            <label for="f-orderDate">注文日</label>
            <input type="date" id="f-orderDate" name="orderDate" required>
          </div>

          <fieldset class="field">
            <legend>注文元の種類</legend>
            <div class="choices">
              <label><input type="radio" name="customerType" value="専門店" required> 専門店</label>
              <label><input type="radio" name="customerType" value="個人"> 個人</label>
            </div>
          </fieldset>

          <div class="field">
            <label for="f-customerName">注文元の名前</label>
            <input type="text" id="f-customerName" name="customerName" required autocomplete="off" placeholder="例：テスト専門店A">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-quantity">数量（袋）</label>
              <input type="number" id="f-quantity" name="quantity" required min="1" step="1" inputmode="numeric">
            </div>
            <div class="field">
              <label for="f-unitPrice">単価（円）</label>
              <input type="number" id="f-unitPrice" name="unitPrice" required min="0" step="1" inputmode="numeric">
            </div>
          </div>

          <div class="field">
            <label for="f-plannedShipDate">出荷予定日</label>
            <input type="date" id="f-plannedShipDate" name="plannedShipDate" required>
            <p id="ship-date-hint" class="hint"></p>
          </div>

          <div class="field">
            <label for="f-shippingMethod">送り方</label>
            <select id="f-shippingMethod" name="shippingMethod" required>
              <option value="">選んでください</option>
              <option value="ゆうパック">ゆうパック</option>
              <option value="宅急便">宅急便</option>
              <option value="小型便">小型便（ゆうパケット・ネコポスなど）</option>
              <option value="直接お届け">直接お届け</option>
            </select>
          </div>

          <div class="field">
            <label for="f-orderChannel">注文の届き方</label>
            <select id="f-orderChannel" name="orderChannel" required>
              <option value="">選んでください</option>
              <option value="メール">メール</option>
              <option value="FAX">FAX</option>
              <option value="フォーム">フォーム</option>
              <option value="電話">電話</option>
            </select>
          </div>

          <div class="field">
            <label for="f-note">備考（なくてもよい）</label>
            <textarea id="f-note" name="note" rows="2"></textarea>
          </div>

          <p id="order-form-message" class="form-message" hidden></p>
          <button type="submit" class="primary">登録</button>
        </form>
      </section>

      <section id="view-ledger" class="view">
        <h2>台帳</h2>
        <p id="ledger-status" class="ledger-status">読み込んでいます…</p>
        <div class="table-scroll">
          <table class="ledger-table">
            <thead>
              <tr>
                <th>注文番号</th>
                <th>注文日</th>
                <th>種類</th>
                <th>注文元</th>
                <th class="num">数量</th>
                <th class="num">単価</th>
                <th>出荷予定日</th>
                <th>送り方</th>
                <th>届き方</th>
                <th>備考</th>
              </tr>
            </thead>
            <tbody id="ledger-body"></tbody>
          </table>
        </div>
      </section>

      <section id="view-sheet" class="view">
        <h2>出荷指示書</h2>
        <p class="placeholder">ここにその日の出荷指示書をつくります（WBS 2-1〜2-3）。</p>
      </section>
    </div>
  </main>

  <footer class="app-footer no-print">
    <div id="firebase-status">Firebase：確認中…</div>
    <div class="only-ok">
      ログイン中：<span class="account-email"></span>
      <button type="button" class="logout-button link-button">ログアウト</button>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
